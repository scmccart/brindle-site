name: refresh-tokens

# Keeps src/styles/brindle-tokens.css in step with the latest Brindle release.
# Opens a PR when the release's brindle-ui-tokens.css differs from the committed copy.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download tokens from the latest Brindle release
        id: fetch
        run: |
          set -euo pipefail
          tag=$(gh release view -R scmccart/brindle --json tagName --jq .tagName)
          if ! gh release download "$tag" -R scmccart/brindle -p brindle-ui-tokens.css -D "$RUNNER_TEMP" --clobber; then
            echo "Release $tag has no brindle-ui-tokens.css yet; nothing to do."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/brindle-ui-tokens.css" src/styles/brindle-tokens.css
      - name: Open a PR when they differ
        if: steps.fetch.outputs.tag != ''
        run: |
          set -euo pipefail
          if git diff --quiet -- src/styles/brindle-tokens.css; then
            echo "Tokens are up to date."
            exit 0
          fi
          branch="chore/tokens-${{ steps.fetch.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(tokens): refresh brindle ui tokens from ${{ steps.fetch.outputs.tag }}"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(tokens): refresh brindle ui tokens from ${{ steps.fetch.outputs.tag }}" \
            --body "Regenerated from the \`brindle-ui-tokens.css\` asset of Brindle ${{ steps.fetch.outputs.tag }}." \
            || echo "A PR for $branch already exists."
